<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reserve Music | Welcome</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <main class="container my-5" style="max-width: 640px;">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">Welcome to Reserve Music</h1>
                    <p class="text-muted mb-4">
                        Add a profile picture so musicians know who they're booking with.
                        You can change this later from your profile page.
                    </p>

                    <!--Filled in by the script at the bottom when the server redirects back with ?error=...-->
                    <div id="error" class="alert alert-danger d-none"></div>

                    <!--Plain form post, same pattern as /register and /login-->
                    <form method="POST" action="/customer/setup">

                        <div class="text-center mb-4">
                            <img src="https://placehold.co/140x140?text=Avatar" alt="Profile picture preview"
                                 class="img-thumbnail" width="140" height="140">
                        </div>

                        <div class="mb-4">
                            <label for="avatar_url" class="form-label">Profile picture URL</label>
                            <input type="url" class="form-control" id="avatar_url" name="avatar_url"
                                   maxlength="500" placeholder="https://example.com/photo.jpg">
                            <div class="form-text">Optional. Paste a link to an image for now.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/discover" class="btn btn-link text-muted text-decoration-none">Skip for now</a>
                            <button type="submit" class="btn btn-dark">Save and continue</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="text-center text-muted py-3">
            <p class="mb-0">&copy; 2026 Group 2 Project</p>
        </footer>

        <!--Same script as the musician setup page: it only reads ?error= and shows it-->
        <script src="/js/musician_setup.js" defer></script>
    </body>
</html>
