<!DOCTYPE html>
<!--
  Gen AI usage (CSCI 3308 syllabus, "Usage of Gen AI tools"): Claude (Anthropic), via Claude Code, 2026-11-03.
  Prompt: "Ok now let's do the musician profile page"
  Response (significant part): Claude wrote this page from the hand-drawn musician profile wireframe
  (MilestoneSubmissions/wireframes/MusicianProfile_012-2.png: tabbed song panel with the song image,
  a play bar with the song name, and the musician's name underneath), with the same nav bar as the
  user profile page. Plain Bootstrap 5.3 components, no template copied.
  Reviewed by Seth Ciancio.
-->
<html lang="en" class="profile-page">
    <head>
        <script src="/js/musicians_profile.js" defer></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reserve Music | Musician</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!--Team color theme (orange + light purple), see the PROFILE PAGES section of style.css-->
        <link rel="stylesheet" href="/css/style.css">
    </head>
    

    <body class="bg-light">
        <!--Nav bar: Back on the left, Logout / Home / Profile on the right (same as the other wireframes)-->
        <nav class="navbar bg-white border-bottom">
            <div class="container">
                <a class="btn btn-link text-dark text-decoration-none" href="javascript:history.back()">&larr; Back</a>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-dark" href="/logout">Logout</a>
                    <a class="btn btn-outline-dark" href="/">Home</a>
                    <a class="btn btn-outline-dark" href="/profile">Profile</a>
                </div>
            </div>
        </nav>

        <main class="container my-5" style="max-width: 720px;">
            <div class="card shadow-sm">
                <div class="card-header bg-white" id="song-header" hidden>
                    <div class="nav nav-tabs card-header-tabs" id="song-tabs"
                         role="group" aria-label="Choose a song"></div>
                </div>

                <div class="card-body">
                    <div id="song-player">
                        <p class="text-muted mb-0">Loading songs…</p>
                    </div>
                    <details id="song-editor" class="mt-3" hidden>
                        <summary class="fw-semibold">Edit song links</summary>
                        <form id="song-form" class="mt-3" aria-describedby="song-help">
                            <p id="song-help" class="small text-muted">
                                Paste a Spotify track, full SoundCloud track, or YouTube video URL.
                                Leave a field blank to remove that song.
                            </p>
                            <div class="mb-3">
                                <label class="form-label" for="song-link-1">Song 1 link</label>
                                <input type="url" id="song-link-1" class="form-control" maxlength="2048">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="song-link-2">Song 2 link</label>
                                <input type="url" id="song-link-2" class="form-control" maxlength="2048">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="song-link-3">Song 3 link</label>
                                <input type="url" id="song-link-3" class="form-control" maxlength="2048">
                            </div>
                            <button id="song-save" class="btn btn-sm btn-dark" type="submit">Save songs</button>
                            <p id="song-status" class="small mt-2 mb-0" role="status"></p>
                        </form>
                    </details>
                </div>

                <!--Musician name along the bottom (from the drawing)-->
                <div class="card-footer bg-white text-center py-3">
                    <h1 id="musician-name" class="h3 mb-0">Musician Name</h1>
                </div>
            </div>

                        <!--About + reviews (filled in by the script below)-->
            <div class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <div class="row align-items-center g-4">
                        <div class="col-12 col-md-auto text-center">
                            <img id="avatar" src="https://placehold.co/140x140?text=Avatar"
                                alt="Profile picture" class="img-thumbnail" width="140" height="140">
                        </div>
                        <div class="col">
                            <p id="username" class="text-muted mb-1"></p>
                            <div class="mb-3">
                                <p id="bio" class="mb-2"></p>

                                <div id="bio-editor" class="d-none">
                                    <textarea id="bio-input" class="form-control mb-2" rows="4" maxlength="500"></textarea>
                                    <div class="d-flex align-items-center gap-2">
                                        <button id="bio-save" class="btn btn-sm btn-dark" type="button">Save</button>
                                        <button id="bio-cancel" class="btn btn-sm btn-outline-secondary" type="button">Cancel</button>
                                        <small id="bio-count" class="text-muted ms-auto"></small>
                                    </div>
                                    <div id="bio-error" class="text-danger small mt-1"></div>
                                </div>

                                <button id="bio-edit" class="btn btn-sm btn-outline-dark d-none" type="button">Edit bio</button>
                            </div>
                            <ul class="list-unstyled mb-0">
                                <li><strong>Location:</strong> <span id="location"></span></li>
                                <li><strong>Starting price:</strong> <span id="price"></span></li>
                                <li id="profile-email" hidden><strong>Email:</strong> <span id="email"></span></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-4" id="profile-reviews" hidden>
                <div class="card-body p-4">
                    <h2 class="h5">Reviews</h2>
                    <div id="reviews">Loading...</div>
                </div>
            </div>


        </main>

        <footer class="text-center text-muted py-3">
            <p class="mb-0">&copy; 2026 Group 2 Project</p>
        </footer>

    </body>
</html>
