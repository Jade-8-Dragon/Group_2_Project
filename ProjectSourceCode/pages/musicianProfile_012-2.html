<!DOCTYPE html>
<!--
  Gen AI usage (CSCI 3308 syllabus, "Usage of Gen AI tools"): Claude (Anthropic), via Claude Code, 2026-11-03.
  Prompt: "Ok now let's do the musician profile page"
  Response (significant part): Claude wrote this page from the hand-drawn musician profile wireframe
  (MilestoneSubmissions/wireframes/MusicianProfile_012-2.png: tabbed song panel with the song image,
  a play bar with the song name, and the musician's name underneath), with the same nav bar as the
  user profile page. Plain Bootstrap 5.3 components, no template copied.
  Reviewed by Seth Ciancio.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reserve Music | Musician</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    
    <script>
    function setText(id, value, fallback) {
        document.getElementById(id).textContent = value || fallback;
    }

    async function loadProfile() {
        try {
            const res = await fetch('/api/profile');
            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }
            const p = await res.json();

            setText('musician-name', p.stage_name || p.username, 'Musician');
            setText('username', '@' + p.username, '');
            setText('bio', p.bio, 'No bio yet.');
            setText('location', p.location, 'Not set');
            setText('email', p.email, '');
            // Postgres NUMERIC arrives as a string, so convert before formatting
            setText('price',
                p.starting_price != null ? '$' + Number(p.starting_price).toFixed(2) : '',
                'Not set');

            if (p.avatar_url) {
                document.getElementById('avatar').src = p.avatar_url;
            }
        } catch (err) {
            console.error('Could not load profile', err);
        }
    }

    async function loadReviews() {
        const box = document.getElementById('reviews');
        try {
            const res = await fetch('/api/reviews');
            if (!res.ok) { box.textContent = 'Could not load reviews.'; return; }
            const reviews = await res.json();

            box.textContent = '';
            if (reviews.length === 0) {
                box.textContent = 'No reviews yet.';
                return;
            }

            reviews.forEach(r => {
                const item = document.createElement('div');
                item.className = 'border rounded p-3 mb-2';

                const head = document.createElement('strong');
                head.textContent = r.customer_name + ' · ' + '★'.repeat(r.rating);

                const body = document.createElement('p');
                body.className = 'mb-0';
                body.textContent = r.comment || '';

                item.append(head, body);
                box.appendChild(item);
            });
        } catch (err) {
            console.error('Could not load reviews', err);
            box.textContent = 'Could not load reviews.';
        }
    }

    loadProfile();
    loadReviews();
    </script>

    <body class="bg-light">
        <!--Nav bar: Back on the left, Login / Home / Profile on the right (same as the other wireframes)-->
        <nav class="navbar bg-white border-bottom">
            <div class="container">
                <a class="btn btn-link text-dark text-decoration-none" href="javascript:history.back()">&larr; Back</a>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-dark" href="/login">Login</a>
                    <a class="btn btn-outline-dark" href="/">Home</a>
                    <a class="btn btn-outline-dark" href="/profile">Profile</a>
                </div>
            </div>
        </nav>

        <main class="container my-5" style="max-width: 720px;">
            <div class="card shadow-sm">
                <!--Song tabs: one tab per song (the folder tabs in the drawing)-->
                <div class="card-header bg-white">
                    <ul class="nav nav-tabs card-header-tabs" id="song-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#song-1"
                                    type="button" role="tab">Song 1</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#song-2"
                                    type="button" role="tab">Song 2</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#song-3"
                                    type="button" role="tab">Song 3</button>
                        </li>
                    </ul>
                </div>

                <div class="card-body tab-content">
                    <!--Song 1: song image, then the play bar with the song name-->
                    <div class="tab-pane fade show active" id="song-1" role="tabpanel">
                        <img src="https://placehold.co/640x360?text=Song+Image" alt="Song image"
                             class="img-fluid rounded border w-100 mb-3">
                        <div class="d-flex align-items-center gap-3">
                            <button class="btn btn-outline-dark rounded-circle" type="button" aria-label="Play">&#9654;</button>
                            <div class="progress flex-grow-1" role="progressbar" aria-label="Song progress">
                                <div class="progress-bar bg-dark" style="width: 0%"></div>
                            </div>
                            <span class="song-name fw-semibold">Song Name 1</span>
                        </div>
                    </div>

                    <!--Song 2-->
                    <div class="tab-pane fade" id="song-2" role="tabpanel">
                        <img src="https://placehold.co/640x360?text=Song+Image" alt="Song image"
                             class="img-fluid rounded border w-100 mb-3">
                        <div class="d-flex align-items-center gap-3">
                            <button class="btn btn-outline-dark rounded-circle" type="button" aria-label="Play">&#9654;</button>
                            <div class="progress flex-grow-1" role="progressbar" aria-label="Song progress">
                                <div class="progress-bar bg-dark" style="width: 0%"></div>
                            </div>
                            <span class="song-name fw-semibold">Song Name 2</span>
                        </div>
                    </div>

                    <!--Song 3-->
                    <div class="tab-pane fade" id="song-3" role="tabpanel">
                        <img src="https://placehold.co/640x360?text=Song+Image" alt="Song image"
                             class="img-fluid rounded border w-100 mb-3">
                        <div class="d-flex align-items-center gap-3">
                            <button class="btn btn-outline-dark rounded-circle" type="button" aria-label="Play">&#9654;</button>
                            <div class="progress flex-grow-1" role="progressbar" aria-label="Song progress">
                                <div class="progress-bar bg-dark" style="width: 0%"></div>
                            </div>
                            <span class="song-name fw-semibold">Song Name 3</span>
                        </div>
                    </div>
                </div>

                <!--Musician name along the bottom (from the drawing)-->
                <div class="card-footer bg-white text-center py-3">
                    <h1 id="musician-name" class="h3 mb-0">Musician Name</h1>
                </div>
            </div>

                        <!--About + reviews (filled in by the script below)-->
            <div class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <div class="row align-items-center g-4">
                        <div class="col-12 col-md-auto text-center">
                            <img id="avatar" src="https://placehold.co/140x140?text=Avatar"
                                alt="Profile picture" class="img-thumbnail" width="140" height="140">
                        </div>
                        <div class="col">
                            <p id="username" class="text-muted mb-1"></p>
                            <p id="bio" class="mb-3"></p>
                            <ul class="list-unstyled mb-0">
                                <li><strong>Location:</strong> <span id="location"></span></li>
                                <li><strong>Starting price:</strong> <span id="price"></span></li>
                                <li><strong>Email:</strong> <span id="email"></span></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <h2 class="h5">Reviews</h2>
                    <div id="reviews">Loading...</div>
                </div>
            </div>


        </main>

        <footer class="text-center text-muted py-3">
            <p class="mb-0">&copy; 2026 Group 2 Project</p>
        </footer>

        <!--Bootstrap JS: needed for the song tabs to switch-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
