<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Reserve Music Login</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- CSS Stylesheet -->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="login-page">
        <main class="login-main">
            <div class="login-content">
                <h2 id="login-header">Reserve Music Login</h2>

                <!-- Login Form -->
                <form action="/login" method="POST">
                    <!-- Username or Email -->
                    <div class="mb-4 text-center" id="username-title">
                        <label for="username" class="form-label">
                            Username or Email:
                        </label>
                        <input
                            class="form-control"
                            type="text"
                            id="username"
                            name="identifier"
                            placeholder="Enter username or email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="mt-3 text-center" id="password-title">
                        <label for="password" class="form-label">
                            Password:
                        </label>
                        <input
                            class="form-control"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <!-- Login Error Message -->
                    <div
                        class="alert alert-danger mt-3 d-none"
                        id="login-error"
                        role="alert"
                    ></div>

                    <!-- Submit Button -->
                    <div class="mt-3 text-center">
                        <button type="submit" class="btn btn-primary px-4">
                            Submit
                        </button>
                    </div>
                </form>

                <!-- Forgot Password -->
                <div class="mt-3 text-center">
                    <a href="/forgot-password">Forgot Password?</a>
                </div>

                <!-- Registration -->
                <div class="mt-3 text-center" id="notRegisteredYet">
                    <p class="mb-2">Don't have an account?</p>
                    <a href="/register">Register Here</a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div id="footer">
            <footer>
                <p class="mb-0">© 2026 Group 2 Project</p>
            </footer>
        </div>

        <!-- Login Errors and Registration Messages -->
        <script>
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            const message = params.get('message');
            const errorElement = document.getElementById('login-error');

            const identifier = params.get('identifier');

            if (identifier) {
                document.getElementById('username').value = identifier;
            }

            if (error === 'unverified') {
                errorElement.innerHTML =
                    'Please verify your email address before logging in. ' +
                    'Check your inbox or <a href="#" id="resend-verification-link">request a new verification link</a>.';

                errorElement.classList.remove('d-none');

                document.getElementById('resend-verification-link')
                    .addEventListener('click', async (event) => {
                        event.preventDefault();

                        const identifier = document.getElementById('username').value.trim();

                        try {
                            const response = await fetch('/resend-verification', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ identifier })
                            });

                            if (response.ok) {
                                errorElement.textContent =
                                    'If your account exists and needs verification, a new verification email has been sent.';
                            } else {
                                errorElement.textContent =
                                    'Unable to send a verification email. Please try again.';
                            }
                        } catch (error) {
                            errorElement.textContent =
                                'Unable to send a verification email. Please try again.';
                        }
                    });

            } else if (error === 'invalid') {
                errorElement.textContent =
                    'Invalid username/email or password.';
                errorElement.classList.remove('d-none');
            }

            if (message === 'verify-email') {
                errorElement.classList.remove('alert-danger');
                errorElement.classList.add('alert-success');
                errorElement.textContent =
                    'Account created! Please check your email and click the verification link before logging in.';
                errorElement.classList.remove('d-none');

            } else if (message === 'verification-sent') {
                errorElement.classList.remove('alert-danger');
                errorElement.classList.add('alert-success');
                errorElement.textContent =
                    'If your account exists and needs verification, a new verification email has been sent.';
                errorElement.classList.remove('d-none');
            }
        </script>
    </body>
</html>
