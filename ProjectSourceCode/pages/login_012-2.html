<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Set starting viepoint to 100%-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <title>Website Login Page</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">   

        <!--CSS Stylesheet Link-->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="login-page">
        <!--Main Content-->
        <main class="login-main">
            <!--Please configure wording once website name is figured out(NOT DONE)-->
            <div class="login-content">
                <h2 id="login-header">Reserve Music Login</h2>

                <form action="/login" method="POST">
                    <!--Username or email-->
                    <div class="mb-4 text-center" id="username-title">
                        <label for="username" class="form-label">
                            Username or Email:
                        </label>
                        <input 
                            class="form-control"
                            type="text" 
                            id="username" 
                            name="identifier"
                            placeholder="Enter username or email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <!--Password-->
                    <div class="mt-3 text-center" id="password-title">
                        <label for="password">
                            Password:
                        </label>
                        <input 
                            class="form-control"
                            type="password" 
                            id="password"
                            name="password"
                            placeholder="Enter password: "
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <!--Submit Button-->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">
                            Submit
                        </button>
                    </div>
                </form>

                <div class="mt-3 text-center" id="notRegisteredYet">
                    <p class="mb-2">Don't have an account?</p>
                    <a href="/register">Register Here</a>
                </div>
            </div>
        </main>

        <!--Configure(NOT DONE)-->
        <div id="footer">
            <footer>
                <p class="mb-0">© 2026 Group 2 Project</p>
            </footer>
        </div>
    </body>
</html>
