<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Set starting viepoint to 100%-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <title>Website Registration Page</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">   

        <!--CSS Stylesheet Link-->
        <link rel="stylesheet" href="css/style.css">  
    </head>

    <body class="registration-page">
        <main class="registration-main">
            <!--Please configure wording once website name is figured out(NOT DONE)-->
            <div class="registration-content">
                <h1 id="registration-header">Register for Reserve Music</h1>
                

                <form action="/register" method="POST">
                    <!--Username-->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username: </label>
                        <input 
                            type="text"
                            class="form-control"
                            id ="username"
                            name="username"
                            placeholder="Enter Username: "
                            autocomplete="username"
                            required
                        >
                        <div class="invalid-feedback" id="username-error"></div>
                    </div>

                    <!--Password-->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password: </label>
                        <input 
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter Password: "
                            autocomplete="new-password"
                            required
                        >
                        <div class="invalid-feedback" id="password-error"></div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">Email: </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter Email: "
                            autocomplete="email"
                            required
                        >
                        <div class="invalid-feedback" id="email-error"></div>
                    </div>

                    <fieldset class="mb-4 text-center">
                        <legend class="account-type-title">
                            Choose your account type:
                        </legend>

                        <div class="btn-group">
                            <input 
                                type="radio"
                                class="btn-check"
                                name="role"
                                id="customer"
                                value="customer"
                                required
                            >
                        <label class="btn btn-outline-primary" for="customer">
                            Customer
                        </label>
                        <input
                            type="radio"
                            class="btn-check"
                            name="role"
                            id="musician"
                            value="musician"
                            required
                        >
                        <label class="btn btn-outline-primary" for="musician">
                            Musician
                        </label>
                    </div>
                    <div class="invalid-feedback" id="role-error"></div>
                </fieldset>

                    <!--Errors that don't belong to one field-->
                    <div class="alert alert-danger d-none" id="form-error" role="alert"></div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">
                            Submit
                        </button>
                    </div>
                </form>

                <!--ADD A LOGIN REDIRECT LINK-->
                <div class="mt-4 text-center" id="alreadyLoggedIn">
                    <p class="mb-2">Have an account?</p>
                    <a href="/login">Login Here</a>
                </div>
            </div>
        </main>
        
        <footer id="footer">
            <p class="mb-0">© 2026 Group 2 Project</p>
        </footer>

        <!--Shows server error messages under the matching field-->
        <script src="js/register.js"></script>
    </body>
</html>
