<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Set starting viepoint to 100%-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <title>Website Login Page</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">   

        <!--CSS Stylesheet Link-->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <!--Main Content-->
        <main>
            <!--Please configure wording once website name is figured out(NOT DONE)-->
            <div class="text-center mb-3">
                <h2>Login</h2>
            </div>

            <form action="/login" method="POST">

                <!--Username-->
                <div class="mt-3" id="username-title">
                    <label for="username">Username:</label>
                </div>
                <div class="mb-3 border username">
                    <input 
                    type="text" 
                    id="username" 
                    name="username"
                    placeholder="Enter your username: "
                    required
                    >
                </div>

                <br>

                <!--Password-->
                <div class="mt-3" id="password-title">
                    <label for="password">Password:</label>
                </div>
                <div class="mb-3 border password">
                    <input 
                    type="password" 
                    id="password"
                    name="password"
                    placeholder="Please enter your password: "
                    required
                    >
                </div>

                <!--Email-->
                <div class="mt-3" id="email-title">
                    <label for="email">Email: </label>
                </div>
                <div class="mb-3 border email">
                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Please Enter Your Email: "
                    required
                    >
                </div>

                <!--Submit Button-->
                <div class="mb-3 text-center" id="submit-button">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>

            </form>
        </main>

        <!--ADD A REGISTRATION REDIRECT LINK
        If the login fails 3 times send the user to registration page
        -->
        <div class="mt-3 text-center">
            <p>Don't have an account?</p>
            <a href="register.html">Register Here</a>
        </div>

        <!--Configure(NOT DONE)-->
        <div class="mt-3" id="footer">
            <footer>
                <p>© 2026 Group 2 Project</p>
            </footer>
        </div>
    </body>
</html>
