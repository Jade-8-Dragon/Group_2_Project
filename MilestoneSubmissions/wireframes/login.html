<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Set starting viepoint to 100%-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <title>Website Login Page</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">   

        <!--CSS Stylesheet Link-->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <div class="mb-3" id="login-title">
            <h1>Login Page</h1>
        </div>

        <!--Main Content-->
        <main>
            <form action="/submit" method="POST">

                <!--Username-->
                <div class="mb-3" id="username-title">
                    <label for="username">Username:</label>
                </div>
                <div class="mb-3 border" id="username-password">
                    <input 
                    type="text" 
                    id="username" 
                    name="username"
                    placeholder="Enter your username: "
                    required
                    >
                </div>

                    <br></br>

                <!--Password-->
                <div class="mb-3" id="password-title">
                    <label for="password">Password:</label>
                </div>
                <div class="mb-3 border" id="username-password">
                    <input 
                    type="password" 
                    id="password"
                    name="password"
                    placeholder="Please enter your password: "
                    required
                    >
                </div>

                <!--Submit Button-->
                <div class="mb-3 text-center border" id="submit-button">
                    <button type="submit">Submit</button>
                </div>

            </form>
        </main>

        <!--Configure(NOT DONE)-->
        <div class="mt-3" id="footer">
            <footer>
                <p>© 2026 Group 2 Project</p>
            </footer>
        </div>
    </body>
</html>
