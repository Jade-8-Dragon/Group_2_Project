<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Set starting viepoint to 100%-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Please configure wording once website name is figured out(NOT DONE)-->
        <title>Website Registration Page</title>

        <!--Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">   

        <!--CSS Stylesheet Link-->
        <link rel="stylesheet" href="css/style.css">  
    </head>

    <body>
        <main>
            <!--Please configure wording once website name is figured out(NOT DONE)-->
            <div class="text-center mb-3">
                <h2>Register</h2>
            </div>

            <form action="/register" method="POST">

                <!--Username-->
                <div class="mt-3" id="username-title">
                    <label for="username">Username: </label>
                </div>
                <div class="mb-3 border username">
                    <input 
                    type="text"
                    id ="username"
                    name="username"
                    placeholder="Enter Username: "
                    required
                    >
                </div>

                <!--Password-->
                <div class="mt-3" id="password-title">
                    <label for="password">Password: </label>
                </div>
                <div class="mb-3 border password">
                    <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password: "
                    required
                    >
                </div>

                <div class="mt-3" id="email-title">
                    <label for="email">Email: </label>
                </div>
                <div class="mb-3 border email">
                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter Email: "
                    required
                    >
                </div>

                <div class="mt-3">
                    <h2>Choose your account type:</h2>
                </div>
                <div class="text-center">
                    <div class="btn-group mb-3" role="group" aria-label="Choose your role">
                        <div>
                            <input 
                            type="radio"
                            class="btn-check"
                            name="role"
                            id="customer"
                            value="customer"
                            required
                            >
                            <label 
                            class="btn btn-outline-primary" 
                            for="customer"
                            >Customer</label>
                        </div>
                        
                        <div>
                            <input
                            type="radio"
                            class="btn-check"
                            name="role"
                            id="musician"
                            value="musician"
                            required
                            >
                            <label 
                            class="btn btn-outline-primary" 
                            for="musician"
                            >Musician</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3 text-center">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </main>
        
        <!--ADD A LOGIN REDIRECT LINK-->
            <div class="mt-3 text-center">
                <p>Have an account?</p>
                <a href="login.html">Login Here</a>
            </div>

            <!--Configure(NOT DONE)-->
            <div class="mt-3" id="footer">
                <footer>
                    <p>© 2026 Group 2 Project</p>
                </footer>
            </div>
    </body>
</html>
